[package]
name = "slapping-game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18.0"
bevy_renet = "3"
serde = { version = "1", features = ["derive"] }
bincode = "1"

# copied from bevy documentation
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3