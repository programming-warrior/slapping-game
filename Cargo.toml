[package]
name = "slapping-game"
version = "0.1.0"
edition = "2024"

[features]
default = ["client"]
client = ["bevy/default"]
server = []

[dependencies]
bevy = { version = "0.18.0", default-features = false, features = ["bevy_core_pipeline", "bevy_render"] }
bevy_renet = "3"
serde = { version = "1", features = ["derive"] }
bincode = "1"

# copied from bevy documentation
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3